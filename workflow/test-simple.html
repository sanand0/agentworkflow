<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Workflow Test</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Simple Workflow Test</h1>
      <p>This tests the basic elkjs import and rendering.</p>
      <div
        id="workflow-container"
        style="border: 1px solid #ccc; min-height: 400px"
      ></div>
      <div id="status" class="mt-3"></div>
    </div>

    <script type="module">
      import { renderWorkflow } from "../js/workflow.js";

      const status = document.getElementById("status");

      // Simple 2-node workflow
      const workflow = {
        workflow: { name: "test", description: "Test", version: "1.0" },
        defaults: { model: "test-model" },
        entry_point: "node1",
        nodes: [
          {
            id: "node1",
            name: "First Node",
            type: "llm",
            instructions: "Do something",
            output_schema: { type: "object", properties: {} },
            next: "node2",
          },
          {
            id: "node2",
            name: "Second Node",
            type: "llm",
            instructions: "Do something else",
            output_schema: { type: "object", properties: {} },
            next: null,
          },
        ],
      };

      status.innerHTML =
        '<div class="alert alert-info">Loading workflow...</div>';

      try {
        const container = document.getElementById("workflow-container");
        const api = await renderWorkflow(container, workflow);

        status.innerHTML =
          '<div class="alert alert-success">✅ Workflow rendered successfully! Click nodes to see details.</div>';

        // Test updating a node
        setTimeout(() => {
          api.update("node1", { state: "completed", output: "Test output" });
        }, 1000);
      } catch (error) {
        status.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}<br><pre>${error.stack}</pre></div>`;
        console.error("Full error:", error);
      }
    </script>
  </body>
</html>
